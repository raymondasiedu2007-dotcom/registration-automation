telegram:
  bot_token: "${TELEGRAM_BOT_TOKEN}"
database:
  path: "registration_bot.sqlite3"
screenshots_dir: "screenshots"
playwright:
  # Always runs headless for safety and deployment consistency.
  headless: true
proxy_rotation:
  enabled: false
  # Optional: fetch one fresh proxy per Playwright browser launch from an authorized proxy provider API.
  # The API may return plain text like "http://user:pass@host:port" or JSON with either
  # {"proxy":"http://user:pass@host:port"} / {"server":"http://host:port","username":"user","password":"pass"}.
  api_url: "${PROXY_API_URL}"
  api_key: "${PROXY_API_KEY}"
  api_key_header: "Authorization"
  api_key_prefix: "Bearer"
  proxy_json_path: "proxy"
  timeout_seconds: 10
ai:
  enabled: false
  provider: "kimi" # or qwen
  base_url: "https://api.moonshot.ai/v1" # example OpenAI-compatible endpoint
  api_key: "${AI_API_KEY}"
  model: "kimi-k2"
  confidence_threshold: 0.8
sites:
  example_site:
    name: "Example Authorized Site"
    domain: "example.com"
    registration_url: "https://example.com/register"
    enabled: true
    required_profile_fields:
      - first_name
      - last_name
      - address_line1
      - address_line2
      - state_region
      - city
      - postal_code
      - phone_number
      - email
    submit_selector: "button[type='submit']"
    field_mappings:
      "#firstName": "first_name"
      "#lastName": "last_name"
      "#email": "email"
