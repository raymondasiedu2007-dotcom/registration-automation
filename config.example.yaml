telegram:
  bot_token: "${TELEGRAM_BOT_TOKEN}"
database:
  path: "registration_bot.sqlite3"
screenshots_dir: "screenshots"
playwright:
  # Always runs headless for safety and deployment consistency.
  headless: true
proxy_rotation:
  enabled: false
  # Optional: fetch one fresh proxy per Playwright browser launch from an authorized proxy provider API.
  # Generic APIs may return plain text like "http://user:pass@host:port" or JSON with either
  # {"proxy":"http://user:pass@host:port"} / {"server":"http://host:port","username":"user","password":"pass"}.
  # Set provider to "9proxy" to call the 9Proxy API with num=1&t=2 by default and parse {"data":["host:port"]}.
  provider: "generic" # or "9proxy"
  api_url: "${PROXY_API_URL}" # optional for 9proxy; defaults to https://api.9proxy.com/api/proxy
  api_key: "${PROXY_API_KEY}"
  api_key_header: "Authorization" # defaults to "api-key" for 9proxy
  api_key_prefix: "Bearer" # defaults to empty for 9proxy
  proxy_json_path: "proxy" # defaults to "data.0" for 9proxy
  proxy_scheme: "http"
  request_params: {} # for 9proxy, add filters such as country, state, city, zip, isp, plan, today, or ports
  timeout_seconds: 10
ai:
  enabled: false
  provider: "kimi" # or qwen
  base_url: "https://api.moonshot.ai/v1" # example OpenAI-compatible endpoint
  api_key: "${AI_API_KEY}"
  model: "kimi-k2"
  confidence_threshold: 0.8
sites:
  example_site:
    name: "Example Authorized Site"
    domain: "example.com"
    registration_url: "https://example.com/register"
    enabled: true
    required_profile_fields:
      - first_name
      - last_name
      - address_line1
      - state_region
      - city
      - postal_code
      - email
      - country
    # Optional fields such as address_line2, phone_number, and password can be added
    # to required_profile_fields if a site requires them.
    submit_selector: "button[type='submit']"
    field_mappings:
      first_name: "#firstName"
      last_name: "#lastName"
      email: "#email"
      country: "#country"
      password: "#password"
